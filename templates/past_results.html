<!DOCTYPE html>
<html>
  <head>
    <title>Past Results</title>
  </head>
  <body>
    <h1>Past Quizzes</h1>
    <table>
      <tr>
        <th>Quiz ID</th>
        <th>Weakest Topic</th>
        <th>Details</th>
      </tr>
      {% for quiz in quizzes %}
      <tr>
        <td>{{ quiz.quiz_id }}</td>
        <td>{{ quiz.weakest_topic }}</td>
        <td>
          <a href="{{ url_for('quiz_details', quiz_id=quiz.quiz_id) }}"
            >View Details</a
          >
        </td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
{% endblock %}
